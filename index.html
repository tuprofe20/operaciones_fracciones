<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>TuProfe20 Lab, Aula 2</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React & Babel -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Fuentes Infantiles y Tecnológicas -->
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700;900&family=Nunito:wght@400;700;900&display=swap" rel="stylesheet">
    
    <!-- KaTeX para Matemáticas -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.css">
    <script src="https://cdn.jsdelivr.net/npm/katex@0.16.8/dist/katex.min.js"></script>
    
    <!-- GSAP para Animaciones Fluidas -->
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.12.2/dist/gsap.min.js"></script>

    <!-- Three.js para fondo 3D -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { 
                        app: ['Nunito', 'sans-serif'], 
                        display: ['Fredoka', 'sans-serif'] 
                    },
                    colors: {
                        brand: { 
                            primary: '#FF007A', secondary: '#00F0FF', tertiary: '#7000FF', 
                            yellow: '#FFE600', green: '#00FF66', orange: '#FF6B00', bg: '#0A0B10' 
                        }
                    },
                    animation: { 
                        popIn: 'popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards', 
                        pulseGlow: 'pulseGlow 2s infinite',
                        float: 'float 3s ease-in-out infinite'
                    },
                    keyframes: {
                        popIn: { 
                            '0%': { opacity: 0, transform: 'scale(0.5) translateY(20px)' }, 
                            '100%': { opacity: 1, transform: 'scale(1) translateY(0)' } 
                        },
                        pulseGlow: { 
                            '0%, 100%': { filter: 'drop-shadow(0 0 10px currentColor)' }, 
                            '50%': { filter: 'drop-shadow(0 0 25px currentColor)' } 
                        },
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' }
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body { 
            font-family: 'Nunito', sans-serif; 
            background-color: #0A0B10; 
            color: #fff; 
            margin: 0; 
            overflow-x: hidden; 
            touch-action: manipulation; 
            -webkit-tap-highlight-color: transparent;
        }
        
        #canvas-bg { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; z-index: -10; pointer-events: none; }
        
        .glass-panel { 
            background: rgba(15, 20, 35, 0.85); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px); 
            border: 2px solid rgba(255, 255, 255, 0.1); 
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5); 
        }
        
        .grid-board {
            background-color: rgba(10, 15, 25, 0.95);
            background-image: radial-gradient(rgba(255, 255, 255, 0.1) 2px, transparent 2px);
            background-size: 30px 30px;
        }

        .neon-text { text-shadow: 0 0 10px currentColor, 0 0 20px currentColor; }
        .bouncy-hover { transition: all 0.2s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .bouncy-hover:hover { transform: translateY(-5px) scale(1.05); }
        .bouncy-hover:active { transform: translateY(2px) scale(0.95); }

        .katex-html { font-weight: 900; text-shadow: 0 0 8px rgba(255,255,255,0.2); }
        .katex { font-size: 1.3em !important; font-family: 'Fredoka', sans-serif !important; }
        
        .robot-float { animation: robotFloat 3s ease-in-out infinite; }
        .robot-glow { animation: robotGlow 2s ease-in-out infinite alternate; }
        .robot-blink { animation: robotBlink 4s infinite; transform-origin: center; }
        @keyframes robotFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes robotGlow { from { filter: drop-shadow(0 0 8px #00F0FF); } to { filter: drop-shadow(0 0 25px #00F0FF); } }
        @keyframes robotBlink { 0%, 45%, 55%, 100% { transform: scaleY(1); } 50% { transform: scaleY(0.1); } }
        
        /* Ocultar scrollbars de la zona de resolución */
        .hide-scrollbar::-webkit-scrollbar { display: none; }
        .hide-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }

        ::-webkit-scrollbar { width: 8px; height: 8px; }
        ::-webkit-scrollbar-track { background: rgba(0,0,0,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.4); }
    </style>
</head>
<body>
    <canvas id="canvas-bg"></canvas>
    <div id="root" class="relative z-10 w-full min-h-[100dvh] flex flex-col"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;

        const audioCtx = typeof window !== 'undefined' ? new (window.AudioContext || window.webkitAudioContext)() : null;
        const playTone = (freq, type, duration, vol = 0.1) => {
            if (!audioCtx) return;
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = type; 
            osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
            gain.gain.setValueAtTime(0, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(vol, audioCtx.currentTime + 0.02);
            gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
            osc.connect(gain); 
            gain.connect(audioCtx.destination);
            osc.start(); 
            osc.stop(audioCtx.currentTime + duration);
        };

        const Sounds = {
            click: () => playTone(800, 'sine', 0.1, 0.05),
            paint: () => playTone(1200, 'triangle', 0.1, 0.05),
            pop: () => playTone(500, 'sine', 0.15, 0.1),
            success: () => { 
                playTone(523.25, 'sine', 0.1, 0.1); 
                setTimeout(() => playTone(659.25, 'sine', 0.1, 0.1), 100); 
                setTimeout(() => playTone(783.99, 'sine', 0.3, 0.1), 200); 
            },
            cheer: () => { 
                [880, 1108, 1318, 1760].forEach((f, i) => setTimeout(() => playTone(f, 'sine', 0.2, 0.1), i * 80)); 
            }
        };

        const Icon = ({ name, size = 24, className = "" }) => {
            const elRef = useRef(null);
            useEffect(() => { 
                if (elRef.current) {
                    lucide.createIcons({ icons: { [name]: lucide.icons[name] }, nameAttr: 'data-lucide', attrs: { class: className, width: size, height: size } }); 
                }
            }, [name, size, className]);
            return <i ref={elRef} data-lucide={name} className={className}></i>;
        };

        const MathTex = ({ tex, block = false, className = "" }) => {
            const elRef = useRef(null);
            useEffect(() => {
                if (elRef.current) {
                    try { katex.render(tex, elRef.current, { displayMode: block, throwOnError: false }); } 
                    catch (e) { elRef.current.innerHTML = tex; }
                }
            }, [tex, block]);
            return <span ref={elRef} className={className}></span>;
        };

        // Robot Asistente Animado
        const AnimatedRobot = ({ className = "w-32 h-32" }) => (
            <svg viewBox="0 0 100 100" className={`overflow-visible ${className}`} xmlns="http://www.w3.org/2000/svg">
                <g className="robot-float">
                    {/* Antena */}
                    <line x1="50" y1="25" x2="50" y2="10" stroke="#94A3B8" strokeWidth="4" strokeLinecap="round" />
                    <circle cx="50" cy="8" r="5" fill="#FF007A" className="animate-pulse" />
                    {/* Cabeza / Pantalla */}
                    <rect x="15" y="25" width="70" height="55" rx="20" fill="#1E293B" stroke="#00F0FF" strokeWidth="4" className="robot-glow" />
                    <rect x="25" y="32" width="50" height="35" rx="12" fill="#0F172A" />
                    {/* Ojos */}
                    <g className="robot-blink origin-center">
                        <circle cx="37" cy="45" r="6" fill="#FFE600" filter="drop-shadow(0 0 5px #FFE600)" />
                        <circle cx="63" cy="45" r="6" fill="#FFE600" filter="drop-shadow(0 0 5px #FFE600)" />
                    </g>
                    {/* Sonrisa */}
                    <path d="M 42 56 Q 50 62 58 56" stroke="#00FF66" strokeWidth="3" fill="none" strokeLinecap="round" filter="drop-shadow(0 0 4px #00FF66)" />
                    {/* Orejas Laterales */}
                    <path d="M 15 42 L 5 47 L 5 53 L 15 58 Z" fill="#FF007A" />
                    <path d="M 85 42 L 95 47 L 95 53 L 85 58 Z" fill="#FF007A" />
                </g>
            </svg>
        );

        const useThreeBackground = () => {
            useEffect(() => {
                const canvas = document.getElementById('canvas-bg');
                const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true });
                renderer.setSize(window.innerWidth, window.innerHeight);
                const scene = new THREE.Scene();
                const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 1, 1000);
                camera.position.z = 200;

                const geometry = new THREE.BufferGeometry();
                const count = window.innerWidth < 768 ? 80 : 150;
                const positions = new Float32Array(count * 3);
                const colors = new Float32Array(count * 3);
                const colorPalette = [new THREE.Color('#00F0FF'), new THREE.Color('#FF007A'), new THREE.Color('#FFE600')];
                
                for(let i=0; i<count; i++) {
                    positions[i*3] = (Math.random() - 0.5) * 400;
                    positions[i*3+1] = (Math.random() - 0.5) * 400;
                    positions[i*3+2] = (Math.random() - 0.5) * 400;
                    const c = colorPalette[Math.floor(Math.random() * colorPalette.length)];
                    colors[i*3] = c.r; colors[i*3+1] = c.g; colors[i*3+2] = c.b;
                }
                
                geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
                geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));
                
                const material = new THREE.PointsMaterial({ 
                    size: 2.5, vertexColors: true, transparent: true, opacity: 0.6, blending: THREE.AdditiveBlending 
                });
                
                const particles = new THREE.Points(geometry, material);
                scene.add(particles);

                let reqId;
                const animate = () => {
                    reqId = requestAnimationFrame(animate);
                    particles.rotation.y += 0.001;
                    particles.rotation.x += 0.0005;
                    renderer.render(scene, camera);
                };
                animate();

                const handleResize = () => { 
                    camera.aspect = window.innerWidth/window.innerHeight; 
                    camera.updateProjectionMatrix(); 
                    renderer.setSize(window.innerWidth, window.innerHeight); 
                };
                window.addEventListener('resize', handleResize);
                return () => { cancelAnimationFrame(reqId); window.removeEventListener('resize', handleResize); geometry.dispose(); material.dispose(); };
            }, []);
        };

        const InteractiveGrid = ({ d, targetN, layers = [], colorClass, onComplete }) => {
            const [selected, setSelected] = useState([]);
            
            useEffect(() => { 
                setSelected([]); 
                if (targetN === 0) onComplete(true);
            }, [d, targetN, layers]);

            // Determinar cuántos bloques ya están pintados por pasos anteriores
            const prePaintedCount = layers.reduce((sum, l) => sum + l.n, 0);

            const toggle = (idx) => {
                if (idx < prePaintedCount) return; // Bloqueado (ya pertenece a la suma anterior)
                if (idx >= prePaintedCount + targetN) return; // Fuera del rango del objetivo actual
                
                if (selected.includes(idx)) {
                    setSelected(selected.filter(i => i !== idx));
                    onComplete(false);
                    Sounds.click();
                } else {
                    if (selected.length < targetN) {
                        const newSel = [...selected, idx];
                        setSelected(newSel);
                        Sounds.paint();
                        if (newSel.length === targetN) {
                            Sounds.success();
                            onComplete(true);
                        }
                    }
                }
            };

            // Estilos dinámicos para columnas según la cantidad para que se vea ordenado
            let gridColsClass = "grid-cols-9";
            if (d === 18) gridColsClass = "grid-cols-6 sm:grid-cols-9";
            if (d === 8) gridColsClass = "grid-cols-4 sm:grid-cols-8";
            if (d === 7) gridColsClass = "grid-cols-7";
            if (d === 9) gridColsClass = "grid-cols-5 sm:grid-cols-9";

            return (
                <div className="flex flex-col items-center w-full gap-4">
                    <div className="bg-slate-900 px-6 py-3 rounded-full font-bold uppercase tracking-widest text-sm border-2 border-brand-secondary shadow-[0_0_15px_rgba(0,240,255,0.3)] text-brand-secondary">
                        {selected.length < targetN ? `TOCA PARA PINTAR ${targetN - selected.length} BLOQUES` : '¡EXCELENTE! CONTINUEMOS'}
                    </div>
                    
                    <div className={`grid w-full max-w-3xl border-[3px] border-slate-500 rounded-xl overflow-hidden shadow-[0_10px_30px_rgba(0,0,0,0.5)] gap-[2px] bg-slate-900 ${gridColsClass}`}>
                        {Array.from({length: d}).map((_, i) => {
                            // Revisar si el bloque actual pertenece a una suma ya pintada (las capas)
                            let layerColor = null;
                            let current = 0;
                            for (const layer of layers) {
                                if (i >= current && i < current + layer.n) {
                                    layerColor = layer.color;
                                    break;
                                }
                                current += layer.n;
                            }

                            const isInteractive = i >= prePaintedCount && i < prePaintedCount + targetN;
                            const isSelected = selected.includes(i);
                            
                            let bg = "bg-slate-800";
                            let innerContent = null;

                            if (layerColor) {
                                bg = `${layerColor} opacity-95 shadow-inner`; // Se mantiene vibrante, es parte de la suma
                                innerContent = <Icon name="check" size={24} className="text-white/40 drop-shadow-sm" />;
                            } else if (isSelected) {
                                bg = `${colorClass} shadow-[inset_0_0_20px_rgba(0,0,0,0.4)]`; 
                                innerContent = <div className="animate-popIn"><Icon name="star" size={24} className="text-white drop-shadow-md" fill="currentColor"/></div>;
                            } else if (isInteractive) {
                                bg = "bg-slate-700 hover:bg-slate-600 cursor-pointer transition-colors";
                            } else {
                                bg = "bg-slate-800/40"; // Futuros bloques
                            }

                            return (
                                <div 
                                    key={i} 
                                    onClick={() => isInteractive && toggle(i)}
                                    className={`aspect-square sm:aspect-auto sm:h-16 flex items-center justify-center relative ${bg}`}
                                >
                                    {innerContent}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        };

        const MixedFractionVisual = ({ w, n, d, colorClass }) => {
            return (
                <div className="flex flex-wrap items-center justify-center gap-3 md:gap-5 bg-slate-900/50 p-4 rounded-3xl border-2 border-slate-700">
                    {/* Enteros (Círculos completos) */}
                    {Array.from({length: w}).map((_, i) => (
                        <div key={`w-${i}`} className="flex flex-col items-center animate-popIn" style={{animationDelay: `${i*0.1}s`}}>
                            <div className={`w-16 h-16 md:w-20 md:h-20 rounded-full shadow-[0_0_20px_currentColor] ${colorClass} flex items-center justify-center border-4 border-white/20`}>
                                <span className="font-black text-2xl drop-shadow-md opacity-50">1</span>
                            </div>
                        </div>
                    ))}
                    
                    {/* Fracción (Círculo parcial como vaso llenándose) */}
                    {n > 0 && (
                        <div className="flex flex-col items-center animate-popIn" style={{animationDelay: `${w*0.1}s`}}>
                            <div className="w-16 h-16 md:w-20 md:h-20 rounded-full border-4 border-slate-500 flex overflow-hidden relative bg-slate-800 shadow-inner">
                                <div className={`absolute bottom-0 left-0 w-full ${colorClass} transition-all duration-1000 ease-out`} 
                                     style={{height: `${(n/d)*100}%`}}>
                                </div>
                                {/* Líneas divisorias */}
                                <div className="absolute inset-0 flex flex-col justify-between py-[10%] opacity-30">
                                    {Array.from({length: d-1}).map((_, i) => (
                                        <div key={i} className="w-full h-[2px] bg-white"></div>
                                    ))}
                                </div>
                            </div>
                            <div className="mt-2 font-display font-bold text-slate-300"><MathTex tex={`\\frac{${n}}{${d}}`} /></div>
                        </div>
                    )}
                </div>
            );
        };

        const EXERCISES = [
            {
                id: "ex1", title: "El Mural de Joaquín", icon: "paint-roller", color: "from-brand-secondary to-blue-600", colorClass: "bg-brand-secondary",
                statement: "Joaquín debe pintar un mural. La primera semana pintó 9/18 y la segunda semana pintó 5/18. ¿Qué fracción le falta pintar durante la tercera semana?",
                steps: [
                    { type: "grid", d: 18, n: 9, layers: [], text: "El mural está dividido en 18 partes. ¡Pinta las 9 partes de la primera semana!", color: "bg-brand-primary" },
                    { type: "grid", d: 18, n: 5, layers: [{n: 9, color: "bg-brand-primary"}], text: "¡Muy bien! Ahora, pinta las 5 partes que avanzó en la segunda semana en la misma cuadrícula.", color: "bg-brand-secondary" },
                    { type: "eq", eq: "\\text{Pintado: } \\frac{9}{18} + \\frac{5}{18} = \\frac{14}{18}", text: "Si sumamos lo que ya pintó, vemos que tiene 14 de las 18 partes listas." },
                    { type: "eq_final", eq: "\\text{Falta: } \\frac{18}{18} - \\frac{14}{18} = \\frac{4}{18}", text: "Para saber cuánto falta, restamos lo pintado del mural completo (18/18).", final: "4/18" }
                ]
            },
            {
                id: "ex2", title: "Cintas de Sandra", icon: "scissors", color: "from-brand-primary to-pink-600", colorClass: "bg-brand-primary",
                statement: "Sandra compró 3 1/2 metros de cinta. Como le faltó, compró 2 1/2 metros más. ¿Qué cantidad total compró?",
                steps: [
                    { type: "mixed", w: 3, n: 1, d: 2, text: "Primero imaginemos la compra inicial: 3 metros enteros y la mitad de otro.", color: "bg-brand-primary" },
                    { type: "mixed_add", w1: 3, n1: 1, d1: 2, w2: 2, n2: 1, d2: 2, text: "Luego compró 2 enteros y otra mitad. ¡Mira las formas!", color: "bg-brand-secondary" },
                    { type: "eq", eq: "\\text{Enteros: } 3 + 2 = 5 \\\\ \\text{Fracciones: } \\frac{1}{2} + \\frac{1}{2} = \\frac{2}{2} = 1", text: "¡Truco! Suma los enteros por un lado y las fracciones por el otro. Dos mitades hacen 1 entero nuevo." },
                    { type: "eq_final", eq: "\\text{Total: } 5 + 1 = 6 \\text{ m}", text: "Finalmente, sumamos los enteros originales con el nuevo entero que formamos.", final: "6 m" }
                ]
            },
            {
                id: "ex3", title: "Mochila Pesada", icon: "book-open", color: "from-brand-yellow to-amber-600", colorClass: "bg-brand-yellow",
                statement: "Un libro pesa 2/3 kg y un cuaderno pesa 2/9 kg. ¿Cuánto pesan juntos?",
                steps: [
                    { type: "eq", eq: "\\frac{2}{3} + \\frac{2}{9} = ?", text: "Queremos sumar, pero los denominadores (3 y 9) son diferentes. ¡Son fracciones heterogéneas!" },
                    { type: "eq", eq: "\\frac{2 \\times 3}{3 \\times 3} = \\frac{6}{9}", text: "Para igualarlos, buscamos una fracción equivalente. Multiplicamos 2/3 por 3 arriba y abajo." },
                    { type: "eq_final", eq: "\\frac{6}{9} + \\frac{2}{9} = \\frac{8}{9} \\text{ kg}", text: "¡Ahora sí! Como los denominadores son iguales (9), solo sumamos los numeradores.", final: "8/9 kg" }
                ]
            },
            {
                id: "ex4", title: "Camino de Valeria", icon: "footprints", color: "from-brand-green to-emerald-600", colorClass: "bg-brand-green",
                statement: "Valeria recorrió 3/8 de un camino por la mañana y 2/8 por la tarde. ¿Qué fracción del camino le falta recorrer?",
                steps: [
                    { type: "grid", d: 8, n: 3, layers: [], text: "El camino tiene 8 tramos. Pinta los 3 tramos de la mañana.", color: "bg-brand-green" },
                    { type: "grid", d: 8, n: 2, layers: [{n: 3, color: "bg-brand-green"}], text: "Ahora, pinta los 2 tramos que avanzó en la tarde ¡Juntos suman el total recorrido!", color: "bg-brand-yellow" },
                    { type: "eq", eq: "\\text{Recorrido: } \\frac{3}{8} + \\frac{2}{8} = \\frac{5}{8}", text: "Sumamos los tramos que ya caminó." },
                    { type: "eq_final", eq: "\\text{Falta: } \\frac{8}{8} - \\frac{5}{8} = \\frac{3}{8}", text: "Si el total es 8/8, le restamos lo que ya caminó para ver cuánto falta.", final: "3/8" }
                ]
            },
            {
                id: "ex5", title: "Decoración de Camila", icon: "party-popper", color: "from-brand-tertiary to-purple-600", colorClass: "bg-brand-tertiary",
                statement: "Para decorar un salón, Camila utilizó 2 1/4 m de cinta azul y 1 3/4 m de cinta roja. ¿Cuántos metros de cinta utilizó en total?",
                steps: [
                    { type: "mixed_add", w1: 2, n1: 1, d1: 4, w2: 1, n2: 3, d2: 4, text: "Visualizamos las cintas azules y rojas.", color: "bg-brand-tertiary" },
                    { type: "eq", eq: "\\text{Enteros: } 2 + 1 = 3 \\\\ \\text{Fracciones: } \\frac{1}{4} + \\frac{3}{4} = \\frac{4}{4} = 1", text: "Sumamos enteros con enteros. Luego las fracciones: ¡1/4 más 3/4 completan 1 entero!" },
                    { type: "eq_final", eq: "\\text{Total: } 3 + 1 = 4 \\text{ m}", text: "Sumamos los 3 enteros más el nuevo entero que formamos.", final: "4 m" }
                ]
            },
            {
                id: "ex6", title: "Jarra de Jugo", icon: "cup-soda", color: "from-brand-orange to-red-600", colorClass: "bg-brand-orange",
                statement: "Una jarra contiene 5/6 de litro de jugo. Luego se agregan 1/3 de litro más. ¿Cuánto jugo hay ahora en la jarra?",
                steps: [
                    { type: "eq", eq: "\\frac{5}{6} + \\frac{1}{3} = ?", text: "¡Cuidado! Los denominadores son diferentes (6 y 3)." },
                    { type: "eq", eq: "\\frac{1 \\times 2}{3 \\times 2} = \\frac{2}{6}", text: "Convertimos 1/3 a sextos multiplicando arriba y abajo por 2." },
                    { type: "eq_final", eq: "\\frac{5}{6} + \\frac{2}{6} = \\frac{7}{6} \\text{ L}", text: "Ahora sumamos directo. (El resultado es mayor a 1 litro, ¡se llama fracción impropia!)", final: "7/6 L" }
                ]
            },
            {
                id: "ex7", title: "Mural de Beatriz", icon: "palette", color: "from-brand-secondary to-blue-500", colorClass: "bg-brand-secondary",
                statement: "Beatriz pintó el lunes 2/7 de un mural y el martes pintó 1/7 más. ¿Qué fracción del mural le falta pintar?",
                steps: [
                    { type: "grid", d: 7, n: 2, layers: [], text: "Divide el mural en 7. Pinta las 2 partes del lunes.", color: "bg-brand-secondary" },
                    { type: "grid", d: 7, n: 1, layers: [{n: 2, color: "bg-brand-secondary"}], text: "Ahora, pinta la parte que avanzó el martes en la misma cuadrícula.", color: "bg-brand-primary" },
                    { type: "eq", eq: "\\text{Pintado: } \\frac{2}{7} + \\frac{1}{7} = \\frac{3}{7}", text: "En total ha pintado 3/7." },
                    { type: "eq_final", eq: "\\text{Falta: } \\frac{7}{7} - \\frac{3}{7} = \\frac{4}{7}", text: "El mural completo es 7/7. Restamos lo que ya pintó.", final: "4/7" }
                ]
            },
            {
                id: "ex8", title: "Botella de Leche", icon: "milk", color: "from-brand-green to-emerald-500", colorClass: "bg-white",
                statement: "En una botella había 1 litro de leche. José bebió 7/9 de litro. ¿Qué cantidad de leche quedó en la botella?",
                steps: [
                    { type: "eq", eq: "1 \\text{ litro} = \\frac{9}{9}", text: "Truco maestro: Como José bebió en 'novenos' (9), imaginamos que el litro entero se divide en 9 partes." },
                    { type: "grid", d: 9, n: 7, layers: [], text: "Toca para 'beber' (pintar) los 7/9 que tomó José.", color: "bg-brand-primary" },
                    { type: "eq_final", eq: "\\text{Quedó: } \\frac{9}{9} - \\frac{7}{9} = \\frac{2}{9} \\text{ L}", text: "Restamos lo que bebió del total.", final: "2/9 L" }
                ]
            }
        ];

        const App = () => {
            useThreeBackground();
            const [view, setView] = useState('home');
            const [exIdx, setExIdx] = useState(0);
            const [step, setStep] = useState(0);
            const [isStepCompleted, setIsStepCompleted] = useState(false);

            const loadExercise = (idx) => { 
                Sounds.cheer(); 
                setExIdx(idx); 
                setStep(0); 
                setView('lab'); 
            };
            const goHome = () => { 
                Sounds.pop(); 
                setView('home'); 
            };
            
            const ex = EXERCISES[exIdx];
            const maxSteps = ex.steps.length;

            useEffect(() => {
                // Auto-completar pasos que son solo lectura (ecuaciones)
                if (view === 'lab' && step < maxSteps) {
                    const currentStepData = ex.steps[step];
                    if (currentStepData.type.startsWith('eq') || currentStepData.type.startsWith('mixed')) {
                        setIsStepCompleted(true);
                    } else {
                        setIsStepCompleted(false); // Requiere interacción (grid)
                    }
                }
            }, [step, view, exIdx]);

            const nextStep = () => { 
                if (step < maxSteps) { 
                    Sounds.pop(); 
                    setStep(s => s + 1); 
                }
            };
            const prevStep = () => { 
                if (step > 0) { 
                    Sounds.pop(); 
                    setStep(s => s - 1); 
                } 
            };

            // Animaciones de entrada de pantalla
            useEffect(() => { 
                gsap.fromTo(".anim-slide", {y: 40, opacity: 0}, {y: 0, opacity: 1, duration: 0.6, stagger: 0.1, ease: "back.out(1.2)"}); 
            }, [view, step]);

            // ==========================================
            // VISTA: MENÚ PRINCIPAL (Home)
            // ==========================================
            if (view === 'home') {
                return (
                    <div className="flex-1 flex flex-col items-center justify-start p-4 md:p-8 max-w-7xl mx-auto w-full z-10 py-10">
                        
                        <div className="flex flex-col items-center mb-8 md:mb-12 anim-slide mt-8">
                            <AnimatedRobot className="w-32 h-32 md:w-48 md:h-48 mb-6 drop-shadow-[0_0_20px_#00F0FF]" />
                            <h1 className="font-display text-4xl md:text-7xl font-black text-white neon-text uppercase tracking-widest text-center leading-tight">
                                TuProfe20 <br className="md:hidden"/><span className="text-brand-yellow">Lab</span>
                            </h1>
                            <p className="text-lg md:text-2xl text-slate-300 font-bold mt-4 tracking-widest uppercase text-center bg-slate-900/50 px-6 py-2 rounded-full border border-slate-700">
                                Aula 2
                            </p>
                        </div>
                        
                        <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4 md:gap-6 w-full anim-slide px-2 pb-20">
                            {EXERCISES.map((exercise, idx) => (
                                <button key={idx} onClick={() => loadExercise(idx)} 
                                    className={`bouncy-hover relative overflow-hidden rounded-[2rem] bg-gradient-to-br ${exercise.color} p-1 text-left shadow-lg`}>
                                    <div className="h-full w-full bg-[#0F1423]/95 rounded-[1.8rem] p-5 flex flex-col glass-panel hover:bg-[#0F1423]/80 transition-colors">
                                        <div className="flex justify-between items-center mb-4">
                                            <div className={`p-3 bg-gradient-to-br ${exercise.color} rounded-xl text-white shadow-inner`}>
                                                <Icon name={exercise.icon} size={24} />
                                            </div>
                                            <span className="text-xs font-black px-3 py-1 bg-white/10 rounded-full text-white tracking-widest border border-white/20">
                                                Nivel {idx + 1}
                                            </span>
                                        </div>
                                        <h3 className="text-xl font-display font-black text-white mb-2 leading-tight">{exercise.title}</h3>
                                        <p className="text-sm text-slate-400 font-medium line-clamp-3 mt-auto">{exercise.statement}</p>
                                    </div>
                                </button>
                            ))}
                        </div>
                    </div>
                );
            }

            // ==========================================
            // VISTA: LABORATORIO (Paso a Paso)
            // ==========================================
            const isFinished = step === maxSteps;
            let boardContent = null;
            let robotMsg = isFinished ? "¡Misión Cumplida! Eres un genio de las fracciones." : ex.steps[step].text;

            if (!isFinished) {
                const sData = ex.steps[step];
                
                if (sData.type === 'grid') {
                    boardContent = (
                        <InteractiveGrid 
                            d={sData.d} targetN={sData.n} layers={sData.layers} colorClass={sData.color} 
                            onComplete={setIsStepCompleted} 
                        />
                    );
                } 
                else if (sData.type === 'mixed') {
                    boardContent = <MixedFractionVisual w={sData.w} n={sData.n} d={sData.d} colorClass={sData.color} />;
                }
                else if (sData.type === 'mixed_add') {
                    boardContent = (
                        <div className="flex flex-col md:flex-row items-center justify-center gap-6 md:gap-12 w-full">
                            <MixedFractionVisual w={sData.w1} n={sData.n1} d={sData.d1} colorClass="bg-brand-primary" />
                            <div className="text-4xl md:text-6xl font-black text-white bg-slate-800 rounded-full w-16 h-16 md:w-20 md:h-20 flex items-center justify-center shadow-lg border border-slate-600">+</div>
                            <MixedFractionVisual w={sData.w2} n={sData.n2} d={sData.d2} colorClass="bg-brand-secondary" />
                        </div>
                    );
                }
                else if (sData.type.startsWith('eq')) {
                    boardContent = (
                        <div className="glass-panel w-full max-w-4xl p-4 md:p-8 lg:p-10 rounded-[2rem] border-4 border-slate-600 shadow-[0_0_30px_rgba(0,0,0,0.5)] text-center flex flex-col items-center justify-center">
                            {sData.type === 'eq_final' && <Icon name="award" size={60} className="text-brand-yellow mb-4 animate-pulseGlow" />}
                            
                            {/* Zona de Resolución Mejorada (Adaptable a múltiples líneas) */}
                            <div className={`w-full flex flex-col items-center justify-center gap-4 md:gap-6 ${sData.type === 'eq_final' ? 'text-brand-yellow neon-text' : 'text-white'}`}>
                                {sData.eq.split('\\\\').map((line, idx) => (
                                    <div key={idx} className="w-full overflow-x-auto hide-scrollbar py-2 px-2 flex justify-center">
                                        <span className="text-2xl sm:text-3xl md:text-4xl lg:text-5xl font-black min-w-max">
                                            <MathTex tex={line.trim()} />
                                        </span>
                                    </div>
                                ))}
                            </div>
                        </div>
                    );
                }
            } else {
                // PANTALLA FINAL
                boardContent = (
                    <div className="flex flex-col items-center justify-center h-full w-full text-center">
                        <div className="bg-gradient-to-r from-brand-green to-emerald-600 text-slate-900 px-10 py-6 md:px-16 md:py-10 rounded-[3rem] border-8 border-white shadow-[0_0_40px_rgba(0,255,102,0.6)] transform -rotate-2 hover:rotate-0 transition-transform animate-popIn">
                            <div className="text-lg md:text-2xl font-black uppercase tracking-widest mb-2 opacity-80">Respuesta Final</div>
                            <div className="text-5xl md:text-8xl font-black font-display">{ex.steps[maxSteps-1].final}</div>
                        </div>
                        <button onClick={goHome} className="mt-12 bouncy-hover bg-brand-primary text-white font-black uppercase tracking-widest px-8 py-4 rounded-2xl shadow-[0_0_20px_rgba(255,0,122,0.5)] flex items-center gap-3 text-lg border-2 border-white/50">
                            <Icon name="home" /> Volver al Menú
                        </button>
                    </div>
                );
            }

            const progress = (step / maxSteps) * 100;

            return (
                <div className="flex-1 flex flex-col w-full max-w-7xl mx-auto p-3 md:p-6 lg:p-8 z-10 min-h-[100dvh]">
                    
                    {/* Header */}
                    <div className="flex items-center justify-between glass-panel p-3 md:p-4 rounded-[1.5rem] md:rounded-[2rem] border-2 border-slate-700/50 mb-4 shrink-0">
                        <button onClick={goHome} className="bouncy-hover flex items-center justify-center p-3 md:px-6 md:py-3 bg-slate-800 rounded-xl font-black uppercase tracking-widest text-xs md:text-sm hover:bg-slate-700 transition-colors text-slate-300">
                            <Icon name="arrow-left" size={20} /> <span className="hidden sm:inline ml-2">Misiones</span>
                        </button>
                        <div className="flex items-center justify-center gap-3 flex-1">
                            <div className={`bg-gradient-to-br ${ex.color} p-2 md:p-3 rounded-xl text-white shadow-inner`}><Icon name={ex.icon} size={24} /></div>
                            <h2 className="font-display font-black text-xl md:text-2xl text-white text-center">{ex.title}</h2>
                        </div>
                        <div className="w-[44px] md:w-[100px]"></div>
                    </div>

                    {/* Enunciado */}
                    <div className="glass-panel rounded-[1.5rem] p-4 md:p-6 mb-4 md:mb-6 border-l-[6px] border-brand-secondary shadow-lg shrink-0 anim-slide bg-slate-900/60">
                        <h3 className="text-xs font-black uppercase text-brand-secondary tracking-widest mb-2 flex items-center gap-2">
                            <Icon name="file-text" size={16} /> Problema
                        </h3>
                        <p className="text-base md:text-2xl text-slate-200 font-bold leading-snug">{ex.statement}</p>
                    </div>

                    {/* Contenido Principal (Pizarra y Robot) */}
                    <div className="flex-1 flex flex-col lg:flex-row gap-6 lg:gap-10 min-h-0 items-start">
                        
                        {/* Robot Assistant (Columna lateral en desktop, superior en mobile) */}
                        <div className="w-full lg:w-[320px] flex flex-row lg:flex-col gap-4 lg:gap-8 items-center shrink-0 anim-slide mt-2">
                            <div className="w-24 h-24 lg:w-48 lg:h-48 shrink-0 drop-shadow-[0_0_25px_rgba(0,240,255,0.4)]">
                                <AnimatedRobot className="w-full h-full" />
                            </div>
                            
                            <div className="glass-panel w-full p-4 lg:p-6 rounded-[2rem] border-2 border-brand-primary/50 relative shadow-[0_0_30px_rgba(255,0,122,0.2)] text-center flex-1 lg:flex-none">
                                {/* Flecha del Globo de Diálogo (Mobile: Izquierda, Desktop: Arriba) */}
                                <div className="hidden lg:block absolute -top-[16px] left-1/2 -translate-x-1/2 w-0 h-0 border-l-[16px] border-l-transparent border-b-[16px] border-b-brand-primary/50 border-r-[16px] border-r-transparent"></div>
                                <div className="block lg:hidden absolute top-1/2 -left-[14px] -translate-y-1/2 w-0 h-0 border-t-[14px] border-t-transparent border-r-[14px] border-r-brand-primary/50 border-b-[14px] border-b-transparent"></div>
                                
                                <p className="text-sm md:text-lg text-white font-bold leading-relaxed">{robotMsg}</p>
                            </div>
                        </div>

                        {/* Pizarra Interactiva */}
                        <div className="flex-1 w-full glass-panel grid-board rounded-[2rem] md:rounded-[3rem] border-2 md:border-4 border-slate-700 shadow-2xl relative flex flex-col overflow-hidden min-h-[450px] anim-slide">
                            
                            {/* Barra de Progreso */}
                            <div className="w-full h-2 md:h-3 bg-slate-900 absolute top-0 left-0 z-20">
                                <div className="h-full bg-gradient-to-r from-brand-primary via-brand-secondary to-brand-green transition-all duration-700 ease-out shadow-[0_0_15px_#00F0FF]" style={{width: `${progress}%`}}></div>
                            </div>

                            {/* Área de Trabajo */}
                            <div className="flex-1 flex items-center justify-center p-4 md:p-8 relative pt-8 md:pt-12 z-10">
                                <div className="w-full flex items-center justify-center anim-slide" key={step}>
                                    {boardContent}
                                </div>
                            </div>

                            {/* Controles Nav */}
                            {!isFinished && (
                                <div className="bg-slate-900/95 p-3 md:p-5 border-t-2 border-slate-700 flex justify-between items-center z-20 shrink-0 gap-2">
                                    <button onClick={prevStep} disabled={step === 0} 
                                        className="bouncy-hover flex items-center justify-center p-3 md:px-6 md:py-4 rounded-xl bg-slate-800 text-slate-300 font-black uppercase tracking-widest hover:bg-slate-700 disabled:opacity-30 disabled:pointer-events-none text-xs md:text-sm border border-slate-600">
                                        <Icon name="chevron-left" size={20} /> <span className="hidden sm:inline ml-1">Atrás</span>
                                    </button>
                                    
                                    <div className="font-black text-brand-secondary px-4 py-2 rounded-full border border-brand-secondary/30 tracking-widest uppercase text-xs md:text-sm shadow-[0_0_10px_rgba(0,240,255,0.1)] bg-brand-secondary/10">
                                        Paso {step + 1} / {maxSteps}
                                    </div>

                                    <button onClick={nextStep} disabled={!isStepCompleted}
                                        className={`bouncy-hover flex items-center justify-center gap-2 p-3 px-6 md:px-8 md:py-4 rounded-xl font-black uppercase tracking-widest text-white transition-all disabled:opacity-30 disabled:pointer-events-none disabled:grayscale text-xs md:text-sm ${step === maxSteps - 1 ? 'bg-brand-green text-slate-900 shadow-[0_0_15px_#00FF66]' : 'bg-brand-primary shadow-[0_0_15px_#FF007A]'}`}>
                                        <span className="hidden sm:inline">{step === maxSteps - 1 ? 'Revisar' : 'Siguiente'}</span> <Icon name={step === maxSteps - 1 ? 'check' : 'chevron-right'} size={20} />
                                    </button>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
